default_stages:
  - pre-commit

ci:
  autoupdate_commit_msg: 'chore(deps): pre-commit.ci autoupdate'
  autoupdate_schedule: monthly
  autofix_commit_msg: 'style: pre-commit.ci fixes'

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit-ci/pre-commit-ci-config
    rev: v1.6.1
    hooks:
      - id: check-pre-commit-ci-config
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.4
    hooks:
      - id: sync-pre-commit-deps
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        exclude: |
          (?x)^(
            .gitlab-ci.yml|
            .clang-tidy|
            .clang-format
          )
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: name-tests-test
        args:
          - --pytest-test-first
        exclude: |
          (?x)^(
            tools/tests/code_evaluation/jobs/modules/|
            tools/tests/helper.py
          )
      - id: trailing-whitespace
  - repo: https://github.com/google/keep-sorted
    rev: v0.8.0
    hooks:
      - id: keep-sorted
  - repo: https://github.com/hofbi/dev-tools
    rev: 1.12.0
    hooks:
      - id: check-readme-md-consistency
      - id: check-snake-case
      - id: check-no-dashes
        exclude: ^slides/
      - id: check-number-of-lines-count
      - id: check-shellscript-set-options
      - id: check-non-existing-and-duplicate-excludes
      - id: check-max-one-sentence-per-line
        exclude: |
          (?x)^(
            slides
          )
  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        args:
          - --line-length=120
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.4
    hooks:
      - id: rumdl-fmt
        exclude: ^slides/
        language: python # ensures that Renovate can update additional_dependencies
        additional_dependencies:
          - shfmt-py==3.12.0.2
          - clang-format==22.1.5
      - id: rumdl
        exclude: ^slides/
        language: python # ensures that Renovate can update additional_dependencies
        additional_dependencies:
          - shuck-cli==0.0.40
          - clang-format==22.1.5
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        exclude: |
          (?x)^(
            .gitlab-ci.yml|
            .clang-tidy|
            .clang-format
          )
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --strict
        exclude: |
          (?x)^(
            .clang-format|
            .clang-tidy|
            docs/theme/tum.yml
          )
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.4
    hooks:
      - id: toml-sort-fix
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies:
          - cmakelang
      - id: cmake-lint
        additional_dependencies:
          - cmakelang
        exclude: cmake/.*
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-format
      - id: ruff-check
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-pyproject
          - flake8-bugbear # Ruff does not implement all of bugbear
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args:
          - --python-version
          - '3.12'
  - repo: https://github.com/PyCQA/pylint
    rev: v4.0.5
    hooks:
      - id: pylint
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --py312-plus
          - --keep-runtime-typing
  - repo: https://github.com/MarcoGorelli/auto-walrus
    rev: 0.4.1
    hooks:
      - id: auto-walrus
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
  - repo: https://github.com/ewhauser/shuck
    rev: v0.0.41
    hooks:
      - id: shuck
        args:
          - "--fix"
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-github-workflows
  - repo: https://github.com/crate-ci/typos
    rev: v1
    hooks:
      - id: typos
