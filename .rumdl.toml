enable = ["ALL"]

[MD013]
line-length = 0 # Disable all line length checks
reflow = true
reflow-mode = "sentence-per-line"

[code-block-tools]
enabled = true
on-missing-tool-binary = "fail"

[code-block-tools.languages]
shell = {format = ["shuck:format"]}
cpp = {lint = ["clang-format"], format = ["clang-format"]}

[code-block-tools.languages.markdown]
lint = ["rumdl"]
